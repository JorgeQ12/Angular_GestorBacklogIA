server {
    # Escucha en 4200 para no chocar con el backend (host networking).
    listen 4200;
    listen [::]:4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion basica de estaticos
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache de assets con hash
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta no encontrada cae en index.html (Angular router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
