server {
    # Escucha en 4200 para no chocar con el backend (host networking).
    listen 4200;
    listen [::]:4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion basica de estaticos
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy same-origin hacia el backend .NET. Ambos contenedores usan
    # --network=host, por lo que Kestrel esta disponible en 127.0.0.1:8081.
    # El navegador siempre llama al mismo host del frontend: /api/...
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # El index.html NUNCA se cachea: siempre referencia los JS/CSS con hash mas recientes.
    # Esto evita que un navegador siga cargando bundles viejos tras un redeploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # Cache de assets con hash (el nombre cambia cuando cambia el contenido)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta no encontrada cae en index.html (Angular router)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
