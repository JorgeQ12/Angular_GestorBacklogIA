<label
  class="campo-busqueda"
  [class.campo-busqueda--lg]="tamano() === 'lg'"
  [for]="id()"
>
  <span class="ui-visually-hidden">{{ etiqueta() }}</span>
  <app-icono nombre="buscar" aria-hidden="true" />
  <input
    [id]="id()"
    type="search"
    autocomplete="off"
    [attr.minlength]="longitudMinima()"
    [placeholder]="placeholder()"
    [value]="valor()"
    [disabled]="deshabilitado()"
    (input)="actualizarValor($event)"
    (blur)="marcarTocado()"
  />
</label>
