<main class="inicio-sesion">
  <section
    class="inicio-sesion__tarjeta"
    aria-labelledby="inicio-sesion-titulo"
    aria-describedby="inicio-sesion-subtitulo"
  >
    <header class="inicio-sesion__encabezado">
      <span class="inicio-sesion__marca" aria-hidden="true">
        <img src="/brand/logo.svg" width="109" height="158" alt="" />
      </span>
      <h1 id="inicio-sesion-titulo" class="inicio-sesion__titulo">Bienvenido a InterIA</h1>
      <p id="inicio-sesion-subtitulo" class="inicio-sesion__subtitulo">
        Continúa con tu cuenta corporativa de Microsoft.
      </p>
    </header>
    <app-acceso-microsoft
      [autenticando]="autenticando()"
      (iniciarSesion)="iniciarSesionConMicrosoft()"
    />
  </section>
</main>
