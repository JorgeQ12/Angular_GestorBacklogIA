<nav
  class="recorrido-proyecto"
  [class.recorrido-proyecto--sin-progreso]="!mostrarProgreso()"
  aria-labelledby="titulo-recorrido-proyecto"
>
  <header class="recorrido-proyecto__encabezado">
    <strong id="titulo-recorrido-proyecto" class="recorrido-proyecto__titulo">
      {{ titulo() }}
    </strong>
    <span class="recorrido-proyecto__posicion" aria-hidden="true">
      Paso {{ posicionActual() }} de {{ pasos.length }}
    </span>
  </header>

  @if (mostrarProgreso()) {
    <div
      class="recorrido-proyecto__progreso"
      role="progressbar"
      aria-label="Progreso de la definición del proyecto"
      aria-valuemin="1"
      [attr.aria-valuemax]="pasos.length"
      [attr.aria-valuenow]="posicionActual()"
      [attr.aria-valuetext]="textoProgreso()"
    >
      <span [style.width.%]="porcentajeRecorrido()"></span>
    </div>
  }

  <ol class="recorrido-proyecto__lista">
    @for (paso of pasos; track paso.clave) {
      <li
        class="recorrido-proyecto__item"
        [class.recorrido-proyecto__item--actual]="esActual(paso.clave)"
        [class.recorrido-proyecto__item--completado]="estaCompletado(paso.clave)"
      >
        <button
          type="button"
          class="recorrido-proyecto__boton"
          [disabled]="!puedeSeleccionar(paso.clave)"
          [attr.aria-current]="esActual(paso.clave) ? 'step' : null"
          (click)="seleccionarPaso(paso.clave)"
        >
          <span class="recorrido-proyecto__icono" aria-hidden="true">
            <app-icono [nombre]="paso.icono" />
            @if (estaCompletado(paso.clave)) {
              <span class="recorrido-proyecto__confirmacion">
                <app-icono nombre="confirmar" />
              </span>
            }
          </span>
          <span class="recorrido-proyecto__contenido">
            <strong>{{ paso.titulo }}</strong>
            <small>{{ paso.descripcion }}</small>
          </span>
          @if (estaCompletado(paso.clave)) {
            <span class="recorrido-proyecto__estado-accesible">Paso completado</span>
          }
          @if (puedeSeleccionar(paso.clave)) {
            <app-icono class="recorrido-proyecto__direccion" nombre="continuar" />
          }
        </button>
      </li>
    }
  </ol>
</nav>
