<section class="pagina-creacion" aria-labelledby="titulo-creacion-proyecto">
  <app-encabezado-pagina
    idTitulo="titulo-creacion-proyecto"
    [titulo]="tituloEncabezado()"
    [etiqueta]="etiquetaEncabezado"
    [descripcion]="descripcionEncabezado"
    icono="proyectos"
  >
    <button
      encabezadoPaginaAcciones
      type="button"
      class="ui-button ui-button--primary ui-button--on-inverse ui-button--md"
      (click)="volverAlInicio()"
    >
      <app-icono class="ui-button__icon" nombre="volver" />
      Volver al inicio
    </button>
  </app-encabezado-pagina>

  <div class="pagina-creacion__recorrido">
    <app-recorrido-creacion-proyecto
      [pasoActual]="estadoRecorrido().pasoActual"
      [pasosCompletados]="estadoRecorrido().pasosCompletados"
      [pasosNavegables]="estadoRecorrido().pasosNavegables"
      (pasoSeleccionado)="abrirPaso($event)"
    />

    <article class="ui-card pagina-creacion__paso" aria-labelledby="titulo-paso-creacion">
      <header class="ui-card__header pagina-creacion__encabezado-paso">
        <div class="ui-card__heading">
          <span class="ui-card__icon" aria-hidden="true">
            <app-icono [nombre]="pasoActivo().icono" />
          </span>
          <div>
            <h2 id="titulo-paso-creacion" class="ui-card__title">
              {{ pasoActivo().titulo }}
            </h2>
            @if (encabezadoPaso.contenido(); as contenido) {
              <div class="pagina-creacion__detalle-paso">
                <app-icono [nombre]="contenido.iconoDetalle" aria-hidden="true" />
                <strong>{{ contenido.detallePrincipal() }}</strong>
                <span aria-hidden="true">·</span>
                <span>{{ contenido.detalleSecundario() }}</span>
              </div>
            } @else {
              <p class="pagina-creacion__descripcion-paso">
                {{ pasoActivo().descripcion }}
              </p>
            }
          </div>
        </div>
        @if (encabezadoPaso.contenido()?.accion; as accion) {
          <button
            type="button"
            class="ui-button ui-button--secondary ui-button--md"
            [disabled]="accion.deshabilitada()"
            (click)="accion.ejecutar()"
          >
            <app-icono class="ui-button__icon" [nombre]="accion.icono" />
            {{ accion.texto() }}
          </button>
        }
      </header>
      <div class="ui-card__body pagina-creacion__contenido">
        <router-outlet />
      </div>
    </article>
  </div>
</section>
