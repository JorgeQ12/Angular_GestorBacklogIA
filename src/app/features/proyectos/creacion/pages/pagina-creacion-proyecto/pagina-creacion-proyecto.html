<section class="pagina-creacion" aria-labelledby="titulo-creacion-proyecto">
  <app-encabezado-pagina
    idTitulo="titulo-creacion-proyecto"
    titulo="Nuevo proyecto"
    [etiqueta]="etiquetaEncabezado"
    [descripcion]="descripcionEncabezado"
    icono="proyectos"
  >
    <button
      encabezadoPaginaAcciones
      type="button"
      class="ui-button ui-button--primary ui-button--on-inverse ui-button--md"
      (click)="volverAlInicio()"
    >
      <app-icono class="ui-button__icon" nombre="volver" />
      Volver al inicio
    </button>
  </app-encabezado-pagina>

  <div class="pagina-creacion__recorrido">
    <app-recorrido-creacion-proyecto
      [etapaActual]="estadoRecorrido().etapaActual"
      [etapasCompletadas]="estadoRecorrido().etapasCompletadas"
      [etapasNavegables]="estadoRecorrido().etapasNavegables"
    />

    <article class="ui-card pagina-creacion__etapa" aria-labelledby="titulo-etapa-creacion">
      <header class="ui-card__header pagina-creacion__encabezado-etapa">
        <div class="ui-card__heading">
          <span class="ui-card__icon" aria-hidden="true">
            <app-icono [nombre]="etapaActiva().icono" />
          </span>
          <div>
            <h2 id="titulo-etapa-creacion" class="ui-card__title">
              {{ etapaActiva().titulo }}
            </h2>
            <p class="pagina-creacion__descripcion-etapa">
              {{ etapaActiva().descripcion }}
            </p>
          </div>
        </div>
      </header>
      <div class="ui-card__body pagina-creacion__contenido">
        <router-outlet />
      </div>
    </article>
  </div>
</section>
