@if (paso.errorCarga()) {
  <app-estado-error
    class="paso-tipo-solucion__error"
    titulo="No fue posible obtener el borrador"
    descripcion="Verifica la conexión e intenta cargar nuevamente la información."
    [reintentable]="true"
    (reintentar)="paso.cargar()"
  />
} @else if (paso.contenidoListo()) {
  <app-formulario-tipo-solucion-proyecto
    [datosIniciales]="tipoSolucion()"
    [procesando]="paso.procesando()"
    (guardar)="guardarTipoSolucion($event)"
  >
    <footer accionesFormularioTipoSolucion class="ui-form-footer">
      <div class="ui-form-footer__note">
        <app-icono nombre="informacion" aria-hidden="true" />
        <p>Los cambios se guardarán en el borrador.</p>
      </div>
      <button type="submit" class="ui-button ui-button--primary" [disabled]="paso.procesando()">
        Guardar y continuar
        <app-icono class="ui-button__icon ui-button__icon--trailing" nombre="continuar" />
      </button>
    </footer>
  </app-formulario-tipo-solucion-proyecto>
}
