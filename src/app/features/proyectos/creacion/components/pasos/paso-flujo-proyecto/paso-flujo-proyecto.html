@if (paso.errorCarga()) {
  <app-estado-error
    class="paso-flujo__error"
    titulo="No fue posible obtener el borrador"
    descripcion="Verifica la conexión e intenta cargar nuevamente la información."
    [reintentable]="true"
    (reintentar)="paso.cargar()"
  />
} @else if (errorContenido()) {
  <app-estado-error
    class="paso-flujo__error"
    titulo="No fue posible interpretar el flujo"
    descripcion="El diagrama guardado no cumple el contrato esperado y no puede editarse de forma segura."
  />
} @else if (paso.contenidoListo()) {
  @if (flujo(); as flujoProyecto) {
    <div class="paso-flujo__contenido">
      <app-editor-flujo-proyecto
        [flujo]="flujoProyecto"
        [procesando]="paso.procesando()"
        [cambiosPendientes]="cambiosPendientes()"
        (flujoCambiado)="actualizarFlujo($event)"
        (guardarSolicitado)="guardarCambiosFlujo()"
      />

      <footer class="ui-form-footer paso-flujo__acciones">
        <div class="ui-form-footer__note">
          <app-icono nombre="informacion" aria-hidden="true" />
          <p>El diagrama completo se guardará en el borrador del proyecto.</p>
        </div>
        <button
          type="button"
          class="ui-button ui-button--primary"
          [disabled]="paso.procesando()"
          (click)="guardarYFinalizar()"
        >
          <app-icono class="ui-button__icon" nombre="guardar" />
          Guardar proyecto
        </button>
      </footer>
    </div>
  }
}
