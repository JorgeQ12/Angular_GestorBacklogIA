@if (paso.errorCarga()) {
  <app-estado-error
    class="paso-equipo__error"
    titulo="No fue posible obtener el borrador"
    descripcion="Verifica la conexión e intenta cargar nuevamente la información."
    [reintentable]="true"
    (reintentar)="paso.cargar()"
  />
} @else if (paso.contenidoListo()) {
  <app-formulario-equipo-proyecto
    [datosIniciales]="equipo()"
    [procesando]="paso.procesando()"
    [sincronizando]="sincronizando()"
    (progresoCambiado)="actualizarProgreso($event)"
    (guardar)="guardarEquipo($event)"
  >
    <footer accionesFormularioEquipo class="ui-form-footer">
      <div class="ui-form-footer__note">
        <app-icono nombre="informacion" aria-hidden="true" />
        <p>Las asignaciones se guardarán en el borrador.</p>
      </div>
      <button
        type="submit"
        class="ui-button ui-button--primary"
        [disabled]="paso.procesando() || sincronizando()"
      >
        Guardar y continuar
        <app-icono class="ui-button__icon ui-button__icon--trailing" nombre="continuar" />
      </button>
    </footer>
  </app-formulario-equipo-proyecto>
}
