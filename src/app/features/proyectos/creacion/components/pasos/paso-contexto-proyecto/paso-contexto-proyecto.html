@if (errorCarga()) {
  <app-estado-error
    class="paso-contexto__error"
    titulo="No fue posible obtener el borrador"
    descripcion="Verifica la conexión e intenta cargar nuevamente la información."
    [reintentable]="true"
    (reintentar)="cargarContexto()"
  />
} @else if (contexto(); as datosContexto) {
  <app-formulario-contexto-proyecto
    [datosIniciales]="datosContexto"
    [prioridades]="prioridades()"
    [procesando]="procesando()"
    (nombreCambiado)="actualizarNombreProyecto($event)"
    (guardar)="guardarContexto($event)"
  >
    <footer accionesFormularioContexto class="ui-form-footer">
      <div class="ui-form-footer__note">
        <app-icono nombre="informacion" aria-hidden="true" />
        <p>Los cambios se guardarán en el borrador.</p>
      </div>
      <button type="submit" class="ui-button ui-button--primary" [disabled]="procesando()">
        Guardar y continuar
        <app-icono class="ui-button__icon ui-button__icon--trailing" nombre="continuar" />
      </button>
    </footer>
  </app-formulario-contexto-proyecto>
}
