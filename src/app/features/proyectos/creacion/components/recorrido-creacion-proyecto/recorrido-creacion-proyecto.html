<nav class="recorrido-creacion" aria-labelledby="titulo-recorrido-creacion">
  <header class="recorrido-creacion__encabezado">
    <strong id="titulo-recorrido-creacion" class="recorrido-creacion__titulo">
      Definición del proyecto
    </strong>
    <span class="recorrido-creacion__posicion" aria-hidden="true">
      Paso {{ posicionActual() }} de {{ pasos.length }}
    </span>
  </header>

  <div
    class="recorrido-creacion__progreso"
    role="progressbar"
    aria-label="Progreso de la definición del proyecto"
    aria-valuemin="1"
    [attr.aria-valuemax]="pasos.length"
    [attr.aria-valuenow]="posicionActual()"
    [attr.aria-valuetext]="textoProgreso()"
  >
    <span [style.width.%]="porcentajeRecorrido()"></span>
  </div>

  <ol class="recorrido-creacion__lista">
    @for (paso of pasos; track paso.clave) {
      <li
        class="recorrido-creacion__item"
        [class.recorrido-creacion__item--actual]="esActual(paso.clave)"
        [class.recorrido-creacion__item--completado]="estaCompletado(paso.clave)"
      >
        <button
          type="button"
          class="recorrido-creacion__boton"
          [disabled]="!puedeSeleccionar(paso.clave)"
          [attr.aria-current]="esActual(paso.clave) ? 'step' : null"
          (click)="seleccionarPaso(paso.clave)"
        >
          <span class="recorrido-creacion__icono" aria-hidden="true">
            <app-icono [nombre]="paso.icono" />
            @if (estaCompletado(paso.clave)) {
              <span class="recorrido-creacion__confirmacion">
                <app-icono nombre="confirmar" />
              </span>
            }
          </span>
          <span class="recorrido-creacion__contenido">
            <strong>{{ paso.titulo }}</strong>
            <small>{{ paso.descripcion }}</small>
          </span>
          @if (estaCompletado(paso.clave)) {
            <span class="recorrido-creacion__estado-accesible">Paso completado</span>
          }
          @if (puedeSeleccionar(paso.clave)) {
            <app-icono class="recorrido-creacion__direccion" nombre="continuar" />
          }
        </button>
      </li>
    }
  </ol>
</nav>
