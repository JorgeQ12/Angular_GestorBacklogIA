<div class="workflow-node-form" [formGroup]="form()">
  <div class="workflow-node-form__grid">
    <section class="workflow-node-form__identity">
      <header class="workflow-node-form__identity-header is-decision">
        <span aria-hidden="true"><app-icono nombre="flujo" /></span>
        <div><h3>Información principal</h3><p>Formula una condición que pueda resolverse mediante las rutas Sí y No.</p></div>
      </header>
      <div class="workflow-node-form__identity-fields is-single">
        <label class="ui-field">
          <span class="ui-label">Nombre de la decisión</span>
          <input class="ui-control" type="text" formControlName="title" placeholder="Ej: ¿Las credenciales son válidas?">
          <small class="ui-hint">Conecta esta decisión usando las salidas “Sí” y “No” del bloque en el lienzo.</small>
        </label>
      </div>
    </section>

    <project-flow-node-common-fields
      [form]="form()"
      descriptionLabel="Resumen de la decisión"
      descriptionPlaceholder="Explica qué validación se está evaluando en este punto."
      acceptancePlaceholder="Ej: La condición se evalúa con información suficiente y deriva correctamente a cada camino posible."
      rolesHint="Selecciona los roles ya creados a quienes afecta o quienes revisan esta condición."></project-flow-node-common-fields>
  </div>
</div>
