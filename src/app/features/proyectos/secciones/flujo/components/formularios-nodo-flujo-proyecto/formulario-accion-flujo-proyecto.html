<div class="workflow-node-form" [formGroup]="form()">
  <div class="workflow-node-form__grid">
    <section class="workflow-node-form__identity">
      <header class="workflow-node-form__identity-header">
        <span aria-hidden="true"><app-icono nombre="continuar" /></span>
        <div><h3>Información principal</h3><p>Describe la interacción que una persona o el sistema ejecutará.</p></div>
      </header>
      <div class="workflow-node-form__identity-fields is-single">
        <label class="ui-field">
          <span class="ui-label">Nombre de la acción</span>
          <input class="ui-control" type="text" formControlName="title" placeholder="Ej: Iniciar sesión">
        </label>
      </div>
    </section>

    <project-flow-node-common-fields [form]="form()" descriptionLabel="Resumen de la acción"
      descriptionPlaceholder="Ej: Al hacer clic en Iniciar sesión, se validan las credenciales y se permite el acceso. Describe qué la inicia, qué resultado produce y para qué sirve."
      acceptancePlaceholder="Ej: La acción se ejecuta correctamente, genera el resultado esperado y deja listo el siguiente paso."
      rolesHint="Selecciona los roles ya creados que ejecutan o supervisan esta acción."></project-flow-node-common-fields>
  </div>
</div>
