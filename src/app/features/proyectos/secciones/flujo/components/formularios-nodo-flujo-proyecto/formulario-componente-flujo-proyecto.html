<div class="workflow-node-form" [formGroup]="form()">
  <div class="workflow-node-form__grid">
    <section class="workflow-node-form__identity">
      <header class="workflow-node-form__identity-header">
        <span aria-hidden="true"><app-icono nombre="contextoProyecto" /></span>
        <div><h3>Información principal</h3><p>Identifica el componente que captura o presenta información.</p></div>
      </header>
      <div class="workflow-node-form__identity-fields is-single">
        <label class="ui-field">
          <span class="ui-label">Nombre del componente</span>
          <input class="ui-control" type="text" formControlName="title" placeholder="Ej: Información del proyecto">
        </label>
      </div>
    </section>

    <project-flow-node-common-fields
      [form]="form()"
      descriptionLabel="Objetivo del componente"
      descriptionPlaceholder="Explica para qué sirve este componente dentro del flujo."
      acceptancePlaceholder="Ej: El componente captura o presenta la información requerida y deja listo el siguiente paso."
      rolesHint="Selecciona los roles ya creados que usan o validan este componente."></project-flow-node-common-fields>

    <section class="workflow-node-form__data-section">
      <header class="workflow-node-form__data-header">
        <span aria-hidden="true"><app-icono nombre="contextoProyecto" /></span>
        <div><h3>Datos del componente</h3><p>Detalla qué información maneja y cuál es el resultado esperado.</p></div>
      </header>
      <div class="workflow-node-form__data-grid">
        <label class="ui-field" [class.has-error]="isInvalid('capturedData')">
          <span class="ui-label">Información que captura</span>
          <textarea class="ui-control ui-textarea" formControlName="capturedData" placeholder="Ej: Nombre, responsable y descripción del proyecto"></textarea>
          @if (isInvalid('capturedData')) {
            <span class="ui-field-error">La información que captura es obligatoria.</span>
          }
        </label>
        <label class="ui-field" [class.has-error]="isInvalid('requiredFields')">
          <span class="ui-label">Campos obligatorios</span>
          <textarea class="ui-control ui-textarea" formControlName="requiredFields" placeholder="Ej: Nombre del proyecto, responsable y fecha objetivo"></textarea>
          @if (isInvalid('requiredFields')) {
            <span class="ui-field-error">Describe los campos obligatorios del componente.</span>
          }
        </label>
        <label class="ui-field is-wide" [class.has-error]="isInvalid('completionOutcome')">
          <span class="ui-label">Resultado al completarse</span>
          <textarea class="ui-control ui-textarea" formControlName="completionOutcome" placeholder="Ej: La información queda disponible para validar el siguiente paso"></textarea>
          @if (isInvalid('completionOutcome')) {
            <span class="ui-field-error">Este campo es obligatorio.</span>
          }
        </label>
      </div>
    </section>
  </div>
</div>
