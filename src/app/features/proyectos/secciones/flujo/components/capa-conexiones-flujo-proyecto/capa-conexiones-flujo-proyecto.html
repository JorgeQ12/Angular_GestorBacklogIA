@if (modo() === modosCapa.Lineas) {
  <svg
    class="capa-conexiones-flujo"
    [attr.viewBox]="'0 0 ' + estadoEditor.tamanoLienzo.ancho + ' ' + estadoEditor.tamanoLienzo.alto"
    [attr.width]="estadoEditor.tamanoLienzo.ancho"
    [attr.height]="estadoEditor.tamanoLienzo.alto"
    aria-hidden="true"
  >
    <defs>
      <marker id="flecha-flujo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--text-muted)" stroke-width="1.6" />
      </marker>
      <marker id="flecha-decision" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--color-warning)" stroke-width="1.6" />
      </marker>
      <marker id="flecha-seleccionada" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--text-primary)" stroke-width="1.8" />
      </marker>
      <marker id="flecha-previsualizacion" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--color-warning)" stroke-width="1.7" />
      </marker>
    </defs>

    @for (conexion of conexionesRepresentadas(); track conexion.id) {
      <g>
        <path
          class="capa-conexiones-flujo__halo"
          [class.esta-seleccionado]="estadoEditor.idConexionSeleccionada() === conexion.id"
          [attr.d]="conexion.trayectoria"
        />
        <path
          class="capa-conexiones-flujo__linea"
          [class.esta-seleccionado]="estadoEditor.idConexionSeleccionada() === conexion.id"
          [class.es-rama-decision]="conexion.esRamaDecision"
          [attr.d]="conexion.trayectoria"
          [attr.marker-end]="estadoEditor.idConexionSeleccionada() === conexion.id
            ? 'url(#flecha-seleccionada)'
            : conexion.esRamaDecision
              ? 'url(#flecha-decision)'
              : 'url(#flecha-flujo)'"
        />
        <path
          class="capa-conexiones-flujo__area-interaccion"
          data-interaccion-conexion="true"
          [attr.d]="conexion.trayectoria"
          (click)="seleccionarConexion(conexion.id)"
        />

        @if (conexion.etiqueta && !conexion.esRamaDecision) {
          <g class="capa-conexiones-flujo__etiqueta">
            <rect
              class="capa-conexiones-flujo__superficie-etiqueta"
              rx="10"
              ry="10"
              [attr.x]="conexion.rectanguloEtiquetaX"
              [attr.y]="conexion.rectanguloEtiquetaY"
              [attr.width]="conexion.anchoEtiqueta"
              height="20"
            />
            <text
              class="capa-conexiones-flujo__texto-etiqueta"
              [attr.x]="conexion.centroEtiquetaX"
              [attr.y]="conexion.textoEtiquetaY"
            >
              {{ conexion.etiqueta }}
            </text>
          </g>
        }
      </g>
    }

    @if (previsualizacionConexion(); as previsualizacion) {
      <path
        class="capa-conexiones-flujo__linea capa-conexiones-flujo__linea--previsualizacion"
        [class.esta-acoplada]="previsualizacion.idDestino"
        [class.es-rama-decision]="esRamaDecision(previsualizacion.etiqueta)"
        [attr.d]="previsualizacion.trayectoria"
        marker-end="url(#flecha-previsualizacion)"
      />
    }
  </svg>
} @else {
  <div class="capa-conexiones-flujo__superposicion-eliminacion">
    @for (conexion of conexionesRepresentadas(); track conexion.id) {
      @if (!estadoEditor.soloLectura() && estadoEditor.idConexionSeleccionada() === conexion.id) {
        <button
          type="button"
          class="ui-button ui-button--danger capa-conexiones-flujo__boton-eliminar"
          [style.left.px]="conexion.eliminarX"
          [style.top.px]="conexion.eliminarY"
          (click)="eliminarConexion(conexion.id)"
        >
          <app-icono class="ui-button__icon" nombre="eliminar" />
          Eliminar conexión
        </button>
      }
    }
  </div>
}
