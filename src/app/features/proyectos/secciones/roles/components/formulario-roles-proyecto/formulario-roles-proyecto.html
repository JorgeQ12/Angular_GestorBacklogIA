<form class="formulario-roles" [formGroup]="formulario" (ngSubmit)="enviar()">
  <section class="formulario-roles__contenido" aria-labelledby="titulo-roles-proyecto">
    <header class="formulario-roles__encabezado">
      <div>
        <h3 id="titulo-roles-proyecto">Perfiles que participarán en la solución</h3>
        <p>Define su nombre y la responsabilidad que tendrán dentro del proyecto.</p>
      </div>
      <button
        type="button"
        class="ui-button ui-button--secondary ui-button--md"
        [disabled]="procesando()"
        (click)="agregarRol()"
      >
        <app-icono class="ui-button__icon" nombre="agregar" />
        Agregar rol
      </button>
    </header>

    <div class="formulario-roles__lista" formArrayName="roles">
      @for (rol of controlesRoles; track rol; let indice = $index) {
        <app-fila-formulario
          [formGroupName]="indice"
          [numero]="indice + 1"
          [camposEtiquetados]="true"
          [eliminable]="controlesRoles.length > 1"
          [procesando]="procesando()"
          [etiquetaEliminar]="'Eliminar rol ' + (indice + 1)"
          (eliminar)="eliminarRol(indice)"
        >
          <div class="formulario-roles__campos">
            <div class="ui-field">
              <label class="ui-label" [for]="'rol-nombre-' + indice">Nombre del rol</label>
              <input
                [id]="'rol-nombre-' + indice"
                class="ui-control"
                type="text"
                formControlName="nombre"
                [appMensajesError]="mensajesNombre"
                placeholder="Ej. Administrador"
                required
                appErrorCampo
              />
            </div>
            <div class="ui-field">
              <label class="ui-label" [for]="'rol-descripcion-' + indice">Descripción</label>
              <input
                [id]="'rol-descripcion-' + indice"
                class="ui-control"
                type="text"
                formControlName="descripcion"
                [appMensajesError]="mensajesDescripcion"
                placeholder="Describe qué hará este rol dentro de la solución."
                required
                appErrorCampo
              />
            </div>
          </div>
        </app-fila-formulario>
      }
    </div>
  </section>

  <ng-content select="[accionesFormularioRoles]" />
</form>
