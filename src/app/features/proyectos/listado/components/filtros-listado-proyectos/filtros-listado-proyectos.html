<form class="filtros-proyectos" [formGroup]="formulario" aria-label="Filtros de proyectos">
  <div class="ui-field filtros-proyectos__nombre">
    <span class="ui-label ui-label--compact">Proyecto</span>
    <app-campo-busqueda
      [id]="'filtro-proyecto-nombre'"
      etiqueta="Filtrar por nombre del proyecto"
      placeholder="Buscar por nombre"
      formControlName="nombre"
    />
  </div>

  <div class="ui-field">
    <span class="ui-label ui-label--compact">Responsable</span>
    <app-campo-busqueda
      [id]="'filtro-proyecto-responsable'"
      etiqueta="Filtrar por responsable"
      placeholder="Buscar responsable"
      formControlName="responsable"
    />
  </div>

  <div class="ui-field">
    <span id="etiqueta-filtro-proyecto-estado" class="ui-label ui-label--compact">Estado</span>
    <app-selector-campo
      [id]="'filtro-proyecto-estado'"
      etiquetadoPor="etiqueta-filtro-proyecto-estado"
      placeholder="Todos los estados"
      [opciones]="opcionesEstado"
      formControlName="estado"
    />
  </div>

  <button type="button" class="ui-button ui-button--text ui-button--md" (click)="limpiar()">
    <app-icono class="ui-button__icon" nombre="cerrar" />
    Limpiar filtros
  </button>
</form>
