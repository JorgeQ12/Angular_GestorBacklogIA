<div class="tabla-opciones__desplazamiento" tabindex="0" role="region" aria-label="Opciones del catálogo">
  <table class="tabla-opciones">
    <caption class="ui-visually-hidden">
      Opciones disponibles en el catálogo seleccionado
    </caption>
    <colgroup>
      <col class="tabla-opciones__columna-titulo" />
      <col />
      <col class="tabla-opciones__columna-estado" />
      <col class="tabla-opciones__columna-acciones" />
    </colgroup>
    <thead>
      <tr>
        <th scope="col">Título</th>
        <th scope="col">Descripción</th>
        <th scope="col">Estado</th>
        <th scope="col" class="tabla-opciones__acciones-titulo">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (opcion of opciones(); track opcion.id) {
        <tr>
          <td>
            <strong class="tabla-opciones__texto-principal">{{ opcion.nombre }}</strong>
          </td>
          <td>
            <span class="tabla-opciones__descripcion">{{ opcion.descripcion }}</span>
          </td>
          <td>
            <span
              class="tabla-opciones__estado"
              [class.tabla-opciones__estado--inactivo]="!opcion.activo"
            >
              {{ opcion.activo ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          <td class="tabla-opciones__acciones">
            <button
              type="button"
              class="ui-button ui-button--text ui-button--md tabla-opciones__accion-icono"
              [attr.aria-label]="'Editar opción ' + opcion.nombre"
              [attr.title]="'Editar opción ' + opcion.nombre"
              [disabled]="bloqueado()"
              (click)="editarOpcion.emit(opcion)"
            >
              <app-icono nombre="editar" />
            </button>
            <button
              type="button"
              class="ui-button ui-button--text ui-button--md tabla-opciones__accion-icono"
              [attr.aria-label]="(opcion.activo ? 'Desactivar ' : 'Activar ') + opcion.nombre"
              [attr.title]="(opcion.activo ? 'Desactivar ' : 'Activar ') + opcion.nombre"
              [disabled]="bloqueado()"
              (click)="cambiarEstadoOpcion.emit(opcion)"
            >
              <app-icono [nombre]="opcion.activo ? 'ocultar' : 'mostrar'" />
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
